# RublinMart Application Properties

# Database Configuration (H2 File-based or In-Memory fallback)
db.url=jdbc:h2:file:./data/rublinmartdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.username=sa
db.password=
db.driver=org.h2.Driver

# HikariCP Pool Configuration
hikari.maximum-pool-size=10
hikari.minimum-idle=2
hikari.idle-timeout=300000
hikari.connection-timeout=20000

# Chatbot Configuration (mock or gemini)
ai.chatbot.provider=mock
gemini.api.key=
