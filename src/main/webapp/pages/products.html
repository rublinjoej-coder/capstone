<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Products - RublinMart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/product.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="container navbar">
            <a href="/rublinmart/pages/index.html" class="logo">
                <i class="fas fa-shopping-bag"></i> Rublin<span>Mart</span>
            </a>
            <ul id="nav-links" class="nav-links"></ul>
        </div>
    </header>

    <main class="container">
        <div class="catalog-header" style="margin-top:1.5rem;">
            <div>
                <h1 style="color:var(--secondary);">Marketplace Catalog</h1>
                <p style="color:var(--text-muted);">Explore products offered by verified sellers</p>
            </div>
            <div class="search-filter-box">
                <input type="text" id="search-input" class="search-input" placeholder="Search by product name..." onkeyup="if(event.key==='Enter') loadProducts()">
                <select id="category-filter" class="category-select" onchange="loadProducts()">
                    <option value="all">All Categories</option>
                </select>
                <button onclick="loadProducts()" class="btn btn-primary"><i class="fas fa-search"></i> Search</button>
            </div>
        </div>

        <div id="product-grid" class="product-grid"></div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 RublinMart E-Commerce Platform. All rights reserved.
        </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/chatbot.js"></script>
</body>
</html>
