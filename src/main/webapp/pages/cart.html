<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - RublinMart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="container navbar">
            <a href="/rublinmart/pages/index.html" class="logo">
                <i class="fas fa-shopping-bag"></i> Rublin<span>Mart</span>
            </a>
            <ul id="nav-links" class="nav-links"></ul>
        </div>
    </header>

    <main class="container" style="margin-top:2rem;">
        <h1 style="color:var(--secondary); margin-bottom:1.5rem;"><i class="fas fa-shopping-cart"></i> Your Shopping Cart</h1>

        <div id="cart-view-container">
            <div class="cart-layout">
                <div class="cart-table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Unit Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items-body">
                            <!-- Populated by cart.js -->
                        </tbody>
                    </table>
                </div>

                <div id="cart-summary-view" class="cart-summary-card">
                    <!-- Populated by cart.js -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 RublinMart E-Commerce Platform. All rights reserved.
        </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/chatbot.js"></script>
</body>
</html>
