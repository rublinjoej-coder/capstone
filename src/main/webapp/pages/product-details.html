<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - RublinMart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/product.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="container navbar">
            <a href="/rublinmart/pages/index.html" class="logo">
                <i class="fas fa-shopping-bag"></i> Rublin<span>Mart</span>
            </a>
            <ul id="nav-links" class="nav-links"></ul>
        </div>
    </header>

    <main class="container">
        <!-- Product Main Info -->
        <div id="product-detail-view" style="margin-top:2rem;">
            <div style="text-align:center; padding:3rem;"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading details...</p></div>
        </div>

        <!-- Reviews Section -->
        <div id="review-section" class="reviews-section">
            <h2 style="color:var(--secondary); margin-bottom:1.5rem;"><i class="fas fa-star" style="color:var(--accent);"></i> Verified Customer Reviews</h2>
            
            <div id="reviews-container" style="margin-bottom:2.5rem;"></div>

            <div style="background:#f8fafc; border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem;">
                <h3 style="margin-bottom:1rem; color:var(--secondary);">Write a Customer Review</h3>
                <p style="font-size:0.875rem; color:var(--text-muted); margin-bottom:1rem;">Note: You must have purchased this item to publish a review.</p>
                
                <div id="review-alert" style="display:none;"></div>

                <form id="review-form" onsubmit="submitReview(event)">
                    <div class="form-group">
                        <label for="review-rating">Rating Score</label>
                        <select id="review-rating" class="form-control" style="max-width:200px;" required>
                            <option value="5">★★★★★ (5 - Excellent)</option>
                            <option value="4">★★★★☆ (4 - Very Good)</option>
                            <option value="3">★★★☆☆ (3 - Average)</option>
                            <option value="2">★★☆☆☆ (2 - Poor)</option>
                            <option value="1">★☆☆☆☆ (1 - Terrible)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="review-comment">Your Review Comments</label>
                        <textarea id="review-comment" class="form-control" rows="3" placeholder="Share details about performance, quality, and your overall experience..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Submit Review</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 RublinMart E-Commerce Platform. All rights reserved.
        </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/chatbot.js"></script>
</body>
</html>
